<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoPro Flash &amp; Diagnostic Hub</title>
    <meta name="description" content="Logiciel professionnel de diagnostic automobile OBD-II, flash ECU, liaison direct mobile-tablette (Câble/WiFi/Bluetooth) et traducteur/installateur d'applications embarquées toutes marques." />
    <meta property="og:title" content="AutoPro Flash &amp; Diagnostic Hub" />
    <meta property="og:description" content="Logiciel professionnel de diagnostic automobile OBD-II, flash ECU, liaison direct mobile-tablette (Câble/WiFi/Bluetooth) et traducteur/installateur d'applications embarquées toutes marques." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body style="background-color:#070b14;color:#f1f5f9;margin:0;min-height:100vh;">
    <div id="root">
      <div id="autopro-boot-loader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;font-family:system-ui,-apple-system,sans-serif;font-size:13px;color:#94a3b8;">
        <div>Chargement AutoPro Flash &amp; Diagnostic Hub...</div>
        <div id="autopro-boot-fallback" style="display:none;max-width:420px;margin-top:8px;padding:14px;border-radius:12px;background:#0f172a;border:1px solid #334155;color:#cbd5e1;font-size:12px;line-height:1.5;">
          <div style="font-weight:700;color:#fbbf24;margin-bottom:6px;">Chargement bloqué (cache navigateur ou réseau lent)</div>
          <div style="margin-bottom:10px;">Si une ancienne version est restée en cache après la mise à jour, cliquez ci-dessous pour actualiser sans cache :</div>
          <button type="button" onclick="(async function(){try{if('serviceWorker' in navigator){var regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(function(r){return r.unregister();}));}if('caches' in window){var keys=await window.caches.keys();await Promise.all(keys.map(function(k){return window.caches.delete(k);}));}}catch(e){}window.location.replace(window.location.pathname+'?v='+Date.now());})()" style="padding:8px 14px;border-radius:8px;border:none;background:#06b6d4;color:#020617;font-weight:700;font-size:12px;cursor:pointer;">
            Purger le Cache &amp; Recharger
          </button>
        </div>
      </div>
    </div>
    <script>
      setTimeout(function () {
        var el = document.getElementById('autopro-boot-fallback');
        if (el) el.style.display = 'block';
      }, 7000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
